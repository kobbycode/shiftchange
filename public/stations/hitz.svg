<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="hitzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF4081"/>
    </linearGradient>
    <filter id="shadowHitz" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="36" fill="#180B30"/>
  <rect x="10" y="10" width="180" height="180" rx="30" fill="none" stroke="url(#hitzGrad)" stroke-width="4"/>
  <!-- HITZ Text -->
  <text x="100" y="94" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="48" fill="#FF4081" text-anchor="middle" filter="url(#shadowHitz)" letter-spacing="2">HITZ</text>
  <!-- 103.9 FM Pill -->
  <rect x="30" y="112" width="140" height="32" rx="16" fill="url(#hitzGrad)"/>
  <text x="100" y="133" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">103.9 FM</text>
</svg>
