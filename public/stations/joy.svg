<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="joyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B20710"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#joyGrad)"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <!-- Waves -->
  <path d="M 50 140 Q 100 120 150 140" fill="none" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
  <!-- Joy Text -->
  <text x="100" y="92" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" filter="url(#shadow)">JOY</text>
  <!-- 99.7 FM Pill -->
  <rect x="36" y="112" width="128" height="32" rx="16" fill="#FFD700"/>
  <text x="100" y="133" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="18" fill="#111111" text-anchor="middle" letter-spacing="1">99.7 FM</text>
</svg>
